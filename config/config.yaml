# Single source of truth for every parameter in the study.
# Methods section values should be copied FROM here, never typed separately.
# Items marked TODO are open design decisions (see docs/decisions.md).

seed: 2026

paths:
  reference_fasta: data/reference/hg38.analysisSet.fa
  bowtie2_index: data/reference/GRCh38_noalt_as/GRCh38_noalt_as
  pool_dir: data/processed/pool   # one Parquet table per mapped chunk (Task 2B)
  mappability: data/processed/mappability.npz   # S(l) and q(c) (Task 2C)
  results: results

simulation:
  read_length: 36            # decision #2
  fragment_length_min: 36    # decision #2
  fragment_length_max: 500   # decision #2
  length_counts_csv: data/raw/rabinowitz_G1_length_counts.csv  # decision #1
  length_artifact_bp: 101    # decision #1: read-length artifact bin, replaced by mean of neighbours
  chromosomes: [chr1, chr2, chr3, chr4, chr5, chr6, chr7, chr8, chr9, chr10,
                chr11, chr12, chr13, chr14, chr15, chr16, chr17, chr18, chr19,
                chr20, chr21, chr22]   # decision #11: autosomes only
  min_mapq: 40
  pool_size_per_origin: 10000000   # decision #3
  pool_chunk_size: 1000000
  survival_bin_bp: 10

grid:
  fetal_fraction: [0.01, 0.02, 0.03, 0.04, 0.06, 0.08, 0.10, 0.15]
  depth: [1000000, 2500000, 5000000, 10000000]
  # TODO: numeric values. The no-noise level must stay FIRST (index 0): patient seeds use the
  # index (spawn_key (1, i_ff, i_depth, i_noise, i_group)), and patients.py checks it.
  noise_sigma: [none, low, realistic]
  trisomy_fetal_chr21_multiplier: 1.5

patients_per_condition:            # decision #4
  reference: 2000                  # normals only
  train_normal: 10000
  train_t21: 2000
  test_normal: 10000
  test_t21: 2000
  calibration: 10000               # normals only; sets the tree threshold (Task 03)

methods:
  z_threshold: 3.0
  size_selection_window_bp: [40, 156]   # decision #6: Method B keeps fragments 40-156 bp
  size_opt_upper_grid: [120, 125, 130, 135, 140, 145, 150, 155, 160, 165, 170]   # decision #6, B-opt
  short_fragment_bp: 150                # decision #9: Yu et al. z_short
  target_fpr: 0.0013                    # decision #5
  tree_max_depth: [3, 4, 5]             # decision #10
  cv_folds: 5                           # decision #10

evaluation:
  sensitivity_target: 0.95              # decision #13: detection limit
